name: Build Companion Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'companion-*'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Standard Firmwares
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}
        run: /usr/bin/env bash build.sh build-companion-firmwares

      - name: Rename standard outputs
        run: |
          mkdir -p out/standard
          cp out/*.bin out/*.uf2 out/*.hex out/*.zip out/standard/ 2>/dev/null || true
          rm -f out/*.bin out/*.uf2 out/*.hex out/*.zip

      - name: Build Observer Firmwares (MESH_PACKET_LOGGING=1)
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}-obs
          PLATFORMIO_BUILD_FLAGS: -D MESH_PACKET_LOGGING=1
        run: /usr/bin/env bash build.sh build-companion-firmwares

      - name: Tag observer outputs
        run: |
          mkdir -p out/observer
          for f in out/*.bin out/*.uf2 out/*.hex out/*.zip; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if [[ "$base" =~ \.(bin|uf2|hex|zip)$ ]]; then
              ext="${BASH_REMATCH[1]}"
              name="${base%.*}"
              mv "$f" "out/observer/${name}-obs.${ext}"
            fi
          done
          rm -f out/*.bin out/*.uf2 out/*.hex out/*.zip

      - name: Merge outputs
        run: |
          mv out/standard/* out/ 2>/dev/null || true
          mv out/observer/* out/ 2>/dev/null || true
          rmdir out/standard out/observer 2>/dev/null || true
          echo "=== Final output ==="
          ls -la out/ | head -30

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: companion-firmwares
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Companion Firmware ${{ env.GIT_TAG_VERSION }}
          body: ""
          draft: true
          files: out/*